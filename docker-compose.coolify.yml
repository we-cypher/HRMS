# Coolify self-host stack for Horilla HR.
# Deploy this file from Git. Put secrets in Coolify Environment — never commit .env.
#
# Coolify: New Resource → Docker Compose → this repo → compose file:
#   docker-compose.coolify.yml
# Attach the public FQDN to the `web` service only (port 8000).
# Coolify Traefik terminates TLS — do not add the repo nginx service.

services:
  web:
    build: .
    environment:
      DEBUG: "0"
      HORILLA_ENV: production
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS}"
      DATABASE_URL: "${DATABASE_URL}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_INIT_PASSWORD: "${DB_INIT_PASSWORD}"
      REDIS_URL: "${REDIS_URL}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-0}"
      AXES_PROXY_COUNT: "${AXES_PROXY_COUNT:-1}"
      TIME_ZONE: "${TIME_ZONE:-Asia/Kolkata}"
    volumes:
      - media:/app/media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "-H",
          "Host: 127.0.0.1",
          "-H",
          "X-Forwarded-Proto: https",
          "http://127.0.0.1:8000/health/",
        ]
      interval: 30s
      timeout: 30s
      start_period: 600s
      retries: 10
    expose:
      - "8000"

  # Exactly one replica. Do not scale this service.
  scheduler:
    build: .
    command: python manage.py run_scheduler
    environment:
      DEBUG: "0"
      HORILLA_ENV: production
      SECRET_KEY: "${SECRET_KEY}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS}"
      DATABASE_URL: "${DATABASE_URL}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_INIT_PASSWORD: "${DB_INIT_PASSWORD}"
      REDIS_URL: "${REDIS_URL}"
      HORILLA_SKIP_RELEASE_TASKS: "1"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Do not depends_on web healthy: Coolify runs `compose up -d` and fails
    # the whole deploy if migrate has not finished yet.
    # Image HEALTHCHECK curls :8000, which this process never binds.
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 30s
      timeout: 5s
      retries: 1
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-horilla_db}"
      POSTGRES_USER: "${POSTGRES_USER:-horilla_user}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horilla_user} -d ${POSTGRES_DB:-horilla_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  media:
  staticfiles:
